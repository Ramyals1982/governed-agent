name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  governance-tests:
    name: MAS governance tests and repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - name: No keys, databases or credentials in the repository
        run: python scripts/check_repo_hygiene.py
      - name: Gate, audit chain, evidence register and output-guard wiring tests
        run: python -m pytest -q --junitxml=pytest_junit.xml
      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit
          path: pytest_junit.xml

  evidence-freshness:
    # Fails when required evidence is missing, insufficient or expired (policy/evidence_policy.yaml).
    # Run it on every change, but decide in branch protection whether it is a required check: a PR opened
    # after the evidence expired fails here until someone re-runs the red-team tests and records the result.
    name: Evidence is current and sufficient
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python evidence.py status --strict

  dependency-audit:
    name: Dependency vulnerabilities (informational)
    runs-on: ubuntu-latest
    continue-on-error: true      # vulnerability databases change daily; this reports, a human decides
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt
